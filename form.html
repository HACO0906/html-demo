<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表單練習</title>
</head>
<body>
    <form action="" method="get">
        <label for="username">使用著名稱:</label>
        <input  required type="text" id="username" name="username">
        <br>
        <label for="age">使用著年齡:</label>
        <input type="number" id="age" name="age">
        <br>
        <label for="Email">使用著信箱:</label>
        <input required type="email" id="Email" name="Email">
        <br>
        <label for="password">使用著密碼:</label>
        <input  placeholder="請輸入6~8不重複的字元" required type="password" id="password" name="password">
        <br>
        <input type="password" placeholder="密碼 (顯示為 ●●●●)">
        <br>
        <input type="number" placeholder="數字" min="0" max="100">
        <br>
        <input type="tel"   placeholder="電話號碼">
        <br>
        <input type="utl" placeholder="網址">
        <br>
        <input type="date"> <!--日期選擇器-->
        <input type="range" min="0" max="100" value="80">  <!--滑桿-->
        <br>
        <input type="color"> <!--顏色選擇器-->
        <br>
        <input type="file">  <!--檔案上傳-->
        <br>
        <input type="radio" name="gender" value="male">男
        <input type="radio" name="gender" value="female">女
        <br>
        <input type="checkbox" id="agree"><label for="agree">我同意條款</label>

        <button type="submit">註冊</button>
    </form>
</body>
</html>
